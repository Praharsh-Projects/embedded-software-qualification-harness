name: Verification

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify host tests and qualification
        run: ./scripts/verify.sh host

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-${{ matrix.os }}
          path: build/qualification/
          if-no-files-found: warn

  arm:
    name: Generic Cortex-M0+ cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build and inspect ARM artifact
        run: ./scripts/verify.sh arm

      - name: Upload ARM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generic-cortex-m0plus-artifact
          path: |
            build/arm/*.elf
            build/arm/*.bin
            build/arm/*.map
          if-no-files-found: error
